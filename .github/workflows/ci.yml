# CI stages, reusable.
#
# `release.yml` and the publishing workflows call this file with
# `uses: ./.github/workflows/ci.yml`. Reusable workflows are how one workflow
# depends on another's stages: a job cannot `needs:` a job defined in a
# different file, so cross-file ordering has to be expressed by calling that
# file as a workflow.
#
# The matrix deliberately does not run `scripts/quality-check`, because that
# script writes a release gate and several matrix jobs would race to write the
# same file. Each stage runs here; the gate is assembled once, in release.yml.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        exclude:
          # Windows on the oldest and newest interpreters is not a supported
          # configuration. The exclusion is recorded here and explained in the
          # quality report rather than silently dropped.
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt && python -m pip install -e .

      - name: Lint
        run: ruff check src tests scripts

      - name: Format is already applied
        run: ruff format --check src tests scripts

      - name: Types
        run: mypy

      - name: Tests with coverage
        # bash is explicit: the default shell on Windows is PowerShell, and the
        # pipeline status below has to survive a failing pytest run.
        shell: bash
        run: |
          # GitHub injects `set -eo pipefail` into every bash step, which would
          # abort on the failing pipeline before the annotations below could run.
          set +e
          pytest --cov=opencode_toolkit --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=80 2>&1 | tee test-output.txt
          # PIPESTATUS, not $?: $? here would be tee's status, which is 0 even
          # when pytest fails, and the step would pass on a red suite.
          status=${PIPESTATUS[0]}
          set -e
          # Surface the failing test ids as annotations. Without this the only
          # record of *which* test failed is the raw log, which nobody reads.
          if [[ $status -ne 0 ]]; then
            grep -E "^(FAILED|ERROR) " test-output.txt | head -40 | while read -r line; do
              echo "::error title=Test failed::$line"
            done
            grep -E "^(FAILED|ERROR) " test-output.txt | wc -l \
              | xargs -I{} echo "::error title=Test failures::{} failing test(s)"
          fi
          exit $status

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt && python -m pip install -e .

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify the built distributions install in a clean environment
        run: ./scripts/test/clean-environment-check.sh

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14

  doctor:
    name: Environment doctor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: doctor must report no failures
        run: |
          # Written outside the checkout on purpose: doctor inspects the working
          # tree, so an output file left in the repo root makes its own
          # `git.clean` check warn and `--strict` turns that warning into the
          # failure this step is meant to detect.
          python -m opencode_toolkit doctor --format json --strict > "$RUNNER_TEMP/doctor.json"
          cat "$RUNNER_TEMP/doctor.json"
          DOCTOR_REPORT="$RUNNER_TEMP/doctor.json" python - <<'PY'
          import json
          import os
          import sys

          document = json.load(open(os.environ["DOCTOR_REPORT"]))
          failures = document["summary"]["failures"]
          if failures:
              print(f"::error::doctor reported {failures} failure(s)")
              sys.exit(1)
          PY
